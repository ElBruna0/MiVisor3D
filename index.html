<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Visor 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #050505; color: #f4f4f4; font-family: Arial, sans-serif; }
    #viewer { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    header {
      position: fixed; z-index: 2; top: 24px; left: 28px; right: 28px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none;
    }
    .brand { font-size: 12px; letter-spacing: 3px; color: #aaa; text-transform: uppercase; }
    h1 { margin: 9px 0 0; font-size: clamp(22px, 3vw, 34px); font-weight: 500; }
    .tag { border: 1px solid #333; border-radius: 20px; padding: 9px 13px; color: #bbb; font-size: 12px; }
    .bottom {
      position: fixed; z-index: 2; bottom: 24px; left: 28px; right: 28px;
      display: flex; justify-content: space-between; align-items: end; gap: 16px;
      pointer-events: none;
    }
    .hint { color: #999; font-size: 13px; line-height: 1.6; }
    .controls { display: flex; gap: 8px; pointer-events: auto; }
    button {
      background: #171717; border: 1px solid #393939; color: #eee;
      border-radius: 9px; padding: 11px 14px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #282828; }
    #status {
      position: fixed; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
      max-width: min(520px, calc(100vw - 40px)); padding: 18px 22px;
      background: #151515; border: 1px solid #333; border-radius: 12px;
      color: #ddd; text-align: center; line-height: 1.5;
    }
    #status.hidden { display: none; }
    @media (max-width: 600px) {
      header { top: 16px; left: 16px; right: 16px; }
      .bottom { left: 16px; right: 16px; bottom: 16px; flex-direction: column; align-items: stretch; }
      .controls { justify-content: stretch; }
      button { flex: 1; padding: 12px 7px; }
      .tag { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <header>
    <div>
      <div class="brand">3D / EXPLORER</div>
      <h1>Mi Visor 3D</h1>
    </div>
    <div class="tag">VISUALIZADOR INTERACTIVO</div>
  </header>
  <div id="status">Preparando el visor 3D…</div>
  <div class="bottom">
    <div class="hint">Arrastra para girar · Rueda para acercar o alejar<br>Botón derecho para desplazar la vista</div>
    <div class="controls">
      <button id="reset">Restablecer vista</button>
      <button id="rotate">Giro automático: no</button>
      <button id="fullscreen">Pantalla completa</button>
    </div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.querySelector('#viewer');
    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 1000);
    camera.position.set(0, 1.2, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x24242a, 2.1));
    const key = new THREE.DirectionalLight(0xffffff, 3.2);
    key.position.set(4, 6, 5);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x9bbcff, 2.0);
    rim.position.set(-4, 2, -4);
    scene.add(rim);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 0.3;
    controls.maxDistance = 30;
    controls.target.set(0, 0, 0);

    let model = null;
    const loader = new GLTFLoader();
    loader.load(
      './models/model.glb',
      (gltf) => {
        model = gltf.scene;
        scene.add(model);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = 2.2 / maxDim;
        model.scale.setScalar(scale);
        camera.position.set(0, 0.35, 3.8);
        controls.target.set(0, 0, 0);
        controls.update();
        status.classList.add('hidden');
      },
      undefined,
      (error) => {
        console.error('No se pudo cargar models/model.glb:', error);
        status.innerHTML = '<strong>El visor está listo.</strong><br>Falta el modelo 3D.<br>Cuando descargues un archivo .glb, guárdalo en la carpeta <code>models</code> con el nombre <code>model.glb</code> y recarga la página.<br><br>Para abrir la página correctamente, sigue las instrucciones de LEEME.txt.';
      }
    );

    document.querySelector('#reset').addEventListener('click', () => {
      camera.position.set(0, 0.35, 3.8);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    let autoRotate = false;
    document.querySelector('#rotate').addEventListener('click', (event) => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      event.currentTarget.textContent = `Giro automático: ${autoRotate ? 'sí' : 'no'}`;
    });

    document.querySelector('#fullscreen').addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (e) { console.error(e); }
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
